<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="../img/logo.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <title>TechBox | Recuperar senha</title>
</head>
<body data-titulo="Recuperar senha" data-voltar="login.html">

    <header id="cabecalho"></header>

    <main class="container auth">
        <nav class="trilha" aria-label="Você está em">
            <a href="../index.html">Home</a>
            <img src="../img/icones/chevron-right.svg" alt="" width="13" height="13">
            <strong>Recuperação de conta</strong>
        </nav>

        <section class="auth__painel auth__painel--pequeno">
            <form class="auth__form" id="form-recuperar" novalidate>
                <div class="auth__apresentacao">
                    <h1>Esqueceu sua senha?</h1>
                    <p>Sem problemas! Informe o e-mail da sua conta e enviaremos um link para redefinir sua senha.</p>
                </div>

                <div class="campo">
                    <label for="email" class="rotulo-forte">E-mail</label>
                    <div class="entrada">
                        <img src="../img/icones/mail-campo.svg" alt="" width="18" height="18">
                        <input id="email" type="email" placeholder="Digite seu e-mail" autocomplete="email">
                    </div>
                    <span class="mensagem-erro">Digite um e-mail válido.</span>
                </div>

                <button type="submit" class="btn btn--primario btn--bloco auth__enviar">Enviar link de recuperação</button>

                <a href="login.html" class="link auth__voltar">Voltar para o login</a>
            </form>

            <!-- mensagem depois de enviar -->
            <div class="auth__form auth__sucesso escondido" id="sucesso-recuperar">
                <span class="auth__sucesso-icone"><img src="../img/icones/check-branco-20.svg" alt="" width="28" height="28"></span>
                <h1>Confira seu e-mail</h1>
                <p>Enviamos um link de recuperação para <strong id="email-enviado"></strong>. Ele vale por 30 minutos.</p>
                <a href="login.html" class="btn btn--primario btn--bloco">Voltar para o login</a>
            </div>
        </section>
    </main>

    <footer id="rodape"></footer>

    <script src="../js/produtos.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
