<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="../img/logo.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <title>TechBox | Entrar</title>
</head>
<body data-cabecalho="fechar">

    <header id="cabecalho"></header>

    <main class="container auth">
        <nav class="trilha" aria-label="Você está em">
            <a href="../index.html">Home</a>
            <img src="../img/icones/chevron-right.svg" alt="" width="13" height="13">
            <strong>Entrar</strong>
        </nav>

        <section class="auth__painel">
            <form class="auth__form" id="form-login" novalidate>
                <div class="auth__marca so-mobile">
                    <img src="../img/logo.png" alt="" width="37" height="43">
                    <span>TechBox</span>
                </div>

                <div class="auth__apresentacao">
                    <h1>Bem-vindo de volta!</h1>
                    <p>Entre na sua conta para continuar.</p>
                </div>

                <div class="auth__campos">
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <div class="entrada">
                            <img src="../img/icones/mail-campo.svg" alt="" width="18" height="18">
                            <input id="email" type="email" placeholder="Digite seu e-mail" autocomplete="email">
                        </div>
                        <span class="mensagem-erro">Digite um e-mail válido.</span>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <div class="entrada">
                            <img src="../img/icones/lock-campo.svg" alt="" width="18" height="18">
                            <input id="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password">
                            <button type="button" class="btn-olho js-olho" aria-label="Mostrar senha">
                                <img src="../img/icones/eye.svg" alt="" width="18" height="18">
                            </button>
                        </div>
                        <span class="mensagem-erro" id="erro-senha">A senha precisa ter pelo menos 6 caracteres.</span>
                    </div>

                    <div class="auth__opcoes">
                        <label class="caixa-selecao">
                            <input type="checkbox" id="lembrar">
                            Lembrar meu acesso
                        </label>
                        <a href="recuperar-senha.html" class="link">Esqueci minha senha</a>
                    </div>
                </div>

                <button type="submit" class="btn btn--primario btn--bloco auth__enviar">
                    Entrar
                    <img class="so-desktop" src="../img/icones/arrow-right-white.svg" alt="" width="16" height="16">
                </button>

                <div class="auth__rodape">
                    <hr class="divisor so-desktop">
                    <div class="auth__ou so-mobile"><span>ou</span></div>
                    <p class="so-desktop">Ainda não tem uma conta? <a href="cadastro.html" class="link js-link-cadastro">Cadastre-se</a></p>
                    <a href="cadastro.html" class="btn btn--contorno btn--bloco so-mobile js-link-cadastro">Criar conta</a>
                    <p class="auth__seguro so-mobile"><img src="../img/icones/shield-check.svg" alt="" width="16" height="16"> Seus dados protegidos, sempre.</p>
                </div>
            </form>
        </section>
    </main>

    <footer id="rodape"></footer>

    <script src="../js/produtos.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
