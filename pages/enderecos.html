<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="../img/logo.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/conta.css">
    <title>TechBox | Endereços</title>
</head>
<body class="com-abas" data-aba="conta" data-secao="enderecos" data-titulo="Endereços" data-voltar="minha-conta.html">

    <header id="cabecalho"></header>

    <main class="container conta-pagina">
        <aside class="menu-conta" id="menu-conta"></aside>

        <div class="conta__conteudo">
            <nav class="conta__trilha">
                <a href="minha-conta.html">Minha conta</a>
                <img src="../img/icones/chevron-right.svg" alt="" width="13" height="13">
                <strong>Endereços</strong>
            </nav>

            <div class="conta__titulo">
                <h1>Endereços</h1>
                <p>Escolha onde você quer receber seus pedidos.</p>
            </div>

            <section class="secao-conta secao-conta--espacada">
                <div class="secao-conta__cabecalho">
                    <div>
                        <h2>Endereços salvos</h2>
                        <p>Você pode ter até 5 endereços salvos.</p>
                    </div>
                    <button type="button" class="btn btn--primario btn--pequeno js-novo-endereco">
                        <img src="../img/icones/plus-15.svg" alt="" width="15" height="15">
                        Adicionar endereço
                    </button>
                </div>

                <div class="grade-enderecos" id="lista-enderecos"></div>

                <button type="button" class="adicionar-tracejado js-novo-endereco">
                    <img src="../img/icones/plus-azul.svg" alt="" width="16" height="16">
                    Adicionar novo endereço
                </button>
            </section>
        </div>
    </main>

    <footer id="rodape"></footer>

    <script src="../js/produtos.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/conta.js"></script>
</body>
</html>
